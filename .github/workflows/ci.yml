name: ci
on: [push, pull_request]

jobs:
  # Server mode: the shared suite on Postgres, plus Redis-only behaviour (the shared rate
  # limit). Also typecheck, build and the CLI.
  server:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: llmgw
          POSTGRES_PASSWORD: llmgw
          POSTGRES_DB: llmgw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U llmgw -d llmgw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: CLI install, typecheck and tests
        working-directory: cli
        run: |
          npm ci
          npm run typecheck
          npm test
      - run: npm test
      - run: npm run test:int
        env:
          TEST_DATABASE_URL: postgres://llmgw:llmgw@127.0.0.1:5432/llmgw_test
          TEST_REDIS_URL: redis://127.0.0.1:6379

  # Single-user mode: the same shared suite on SQLite, with no database service at all.
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:int:sqlite